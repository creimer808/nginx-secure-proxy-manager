name: Build and publish container image

on:
  push:
    branches:
      - custom
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - custom
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-publish:
    name: Verify, build, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read and validate release metadata
        id: versions
        shell: bash
        run: |
          app_version="$(tr -d '[:space:]' < .app-version)"
          upstream_version="$(tr -d '[:space:]' < .version)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$app_version" =~ $semver ]] || { echo "Invalid .app-version" >&2; exit 1; }
          [[ "$upstream_version" =~ $semver ]] || { echo "Invalid .version" >&2; exit 1; }
          node - "$app_version" "$upstream_version" <<'NODE'
          const fs = require("node:fs");
          const [appVersion, upstreamVersion] = process.argv.slice(2);
          for (const manifest of ["backend/package.json", "frontend/package.json"]) {
            const parsed = JSON.parse(fs.readFileSync(manifest, "utf8"));
            if (parsed.version !== appVersion) throw new Error(`${manifest} version must equal .app-version`);
            if (parsed.upstreamVersion !== upstreamVersion) {
              throw new Error(`${manifest} upstreamVersion must equal .version`);
            }
          }
          NODE
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${app_version}" ]]; then
            echo "Release tag must be v${app_version}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            backend/yarn.lock
            frontend/yarn.lock

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Verify backend
        working-directory: backend
        run: |
          yarn install --frozen-lockfile
          yarn lint
          yarn validate-schema
          node --test

      - name: Build and verify frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn locale-compile
          yarn lint
          yarn vitest run --no-color
          yarn build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release image tag is unused
        if: github.event_name != 'pull_request' && github.ref_type == 'tag'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_version="${{ steps.versions.outputs.app_version }}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          registry_token="$(
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${GITHUB_REPOSITORY}:pull" \
              | jq -er '.token // .access_token'
          )"

          status="$(
            curl --silent --show-error --retry 3 --retry-all-errors \
              --output "$response_file" --write-out '%{http_code}' --head \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${GITHUB_REPOSITORY}/manifests/${app_version}"
          )"

          case "$status" in
            200)
              echo "Refusing to overwrite immutable release image tag: ${IMAGE_NAME}:${app_version}" >&2
              exit 1
              ;;
            404)
              echo "Confirmed that release image tag is unused: ${IMAGE_NAME}:${app_version}"
              ;;
            *)
              echo "Registry returned HTTP ${status}; could not prove that the release tag is unused. Failing closed." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=${{ steps.versions.outputs.app_version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=upstream-${{ steps.versions.outputs.upstream_version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.versions.outputs.app_version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            UPSTREAM_VERSION=${{ steps.versions.outputs.upstream_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
