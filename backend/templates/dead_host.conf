{% include "_header_comment.conf" %}

{% if enabled %}

{% include "_hsts_map.conf" %}

server {
{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

  access_log /data/logs/dead-host-{{ id }}_access.log standard;
  # As for redirection hosts: a separate id space, so these records join the
  # administrator-only fallback log rather than a per-proxy-host one.
  access_log /data/logs/fallback_security.log security_json if=$security_log_enabled;
  error_log /data/logs/dead-host-{{ id }}_error.log warn;

{{ advanced_config }}

{% if use_default_location %}
  location / {
{% include "_hsts.conf" %}
    return 404;
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_dead[.]conf;
}
{% endif %}
