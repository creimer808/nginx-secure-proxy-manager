# Stable identifiers for the built-in exploit rules.
#
# The first matching expression wins. Keep this order aligned with the former
# block-exploits.conf if chain: SQL, file, common, spam, then user-agent rules.
# These declarations make the variables available to log_format at HTTP scope;
# each generated proxy host replaces both values with its own set directives.
map $host $security_proxy_host_id {
    default "";
}

map $host $security_exploit_protection_enabled {
    default 0;
}

# Detection alone never blocks or attributes a request; $security_rule_id is
# blank unless that host enables protection.
map $query_string $security_query_rule_id {
    default "";

    ~union.*select.*\(                         sql.union-select;
    ~union.*all.*select.*                      sql.union-all-select;
    ~concat.*\(                                sql.concat;

    ~[a-zA-Z0-9_]=http://                      file.remote-url-parameter;
    ~[a-zA-Z0-9_]=(\.\.//?)+                  file.path-traversal;
    ~[a-zA-Z0-9_]=/([a-z0-9_.]//?)+            file.absolute-path;

    ~(<|%3C).*script.*(>|%3E)                  common.script-tag;
    "~GLOBALS(=|\[|\%[0-9A-Z]{0,2})"           php.globals;
    "~_REQUEST(=|\[|\%[0-9A-Z]{0,2})"          php.request;
    ~proc/self/environ                          lfi.proc-self-environ;
    "~mosConfig_[a-zA-Z_]{1,21}(=|\%3D)"        joomla.mosconfig;
    ~base64_(en|de)code\(.*\)                   php.base64-code;

    ~\b(ultram|unicauca|valium|viagra|vicodin|xanax|ypxaieo)\b
                                                spam.keyword-group-1;
    ~\b(erections|hoodia|huronriveracres|impotence|levitra|libido)\b
                                                spam.keyword-group-2;
    ~\b(ambien|blue\spill|cialis|cocaine|ejaculation|erectile)\b
                                                spam.keyword-group-3;
    ~\b(lipitor|phentermin|pro[sz]ac|sandyauer|tramadol|troyhamby)\b
                                                spam.keyword-group-4;
}

map $http_user_agent $security_user_agent_rule_id {
    default "";

    ~Indy\ Library                             ua.indy-library;
    ~libwww-perl                                ua.libwww-perl;
    ~GetRight                                   ua.getright;
    ~GetWeb!                                    ua.getweb;
    ~Go!Zilla                                   ua.gozilla;
    ~Download\ Demon                            ua.download-demon;
    ~Go-Ahead-Got-It                            ua.go-ahead-got-it;
    ~TurnitinBot                                ua.turnitinbot;
    ~GrabNet                                    ua.grabnet;
}

# --------------------------------------------------------------------------
# Detect-only rules.
#
# The signatures above are inherited from upstream and are stuck in 2010: they
# look for comment-spam keywords and download managers, and they only ever
# examine the query string and user agent -- never the path. The corpus below
# is what actually arrives at an internet-facing proxy today.
#
# None of these block. Each pattern matches something that is legitimate
# somewhere -- /actuator on a Spring host, /cgi-bin on genuinely old software --
# so they are evidence to review, not grounds to break a working site.
#
# $request_uri is the raw path and query together, which is why path and
# injection patterns share one map.
# --------------------------------------------------------------------------
map $request_uri $security_uri_rule_id {
    default "";

    "~*(?:\$|%24)(?:\{|%7b)jndi:"                inject.log4shell;
    ~*class\.module\.classLoader                 inject.spring4shell;

    ~*/\.env(?:$|[./?])                          path.dotenv;
    ~*/\.git/                                    path.git-config;
    ~*/\.svn/                                    path.svn;
    ~*/\.aws/                                    path.cloud-credentials;
    ~*/latest/meta-data/                         path.cloud-metadata;
    ~*/etc/(?:passwd|shadow)                     path.etc-passwd;
    ~*(?:\.\./|\.\.%2f|%2e%2e/|%2e%2e%2f)        path.traversal;
    ~*/wp-login\.php                             path.wp-login;
    ~*/wp-admin/                                 path.wp-admin;
    ~*/xmlrpc\.php                               path.xmlrpc;
    ~*/(?:phpmyadmin|phpMyAdmin|pma|myadmin)/    path.phpmyadmin;
    ~*/adminer(?:\.php)?(?:$|\?)                 path.adminer;
    ~*/actuator(?:$|[/?])                        path.actuator;
    ~*/vendor/phpunit/                           path.phpunit;
    ~*/cgi-bin/                                  path.cgi-bin;
    ~*/(?:c99|r57|wso|alfa|shell)\.php           path.webshell;
    ~*/(?:autodiscover|owa|ecp)/                 path.exchange;
    ~*/solr/                                     path.solr;
    # Deliberately not .zip or .tar.gz: those are ordinary downloads on plenty
    # of sites. A .sql or .bak served over HTTP is not.
    ~*\.(?:bak|sql|old|swp)(?:$|\?)              path.config-backup;
}

# Tooling that identifies itself. Weak evidence on its own -- a user agent is
# whatever the client says it is -- but a reliable way to spot the untargeted
# background scanning that precedes everything else.
map $http_user_agent $security_scanner_rule_id {
    default "";

    "~*(?:\$|%24)(?:\{|%7b)jndi:"                inject.log4shell;
    ~*nuclei                                     scanner.nuclei;
    ~*sqlmap                                     scanner.sqlmap;
    ~*nikto                                      scanner.nikto;
    ~*masscan                                    scanner.masscan;
    ~*zgrab                                      scanner.zgrab;
    ~*\bnmap\b                                   scanner.nmap;
    ~*wpscan                                     scanner.wpscan;
    ~*(?:gobuster|feroxbuster|dirbuster|ffuf)    scanner.directory-brute;
    ~*(?:censys|expanse|internetmeasurement)     scanner.internet-survey;
}

# Log4Shell payloads are routinely placed in headers rather than the URI.
map $http_referer $security_referer_rule_id {
    default "";

    "~*(?:\$|%24)(?:\{|%7b)jndi:"                inject.log4shell;
}

# --------------------------------------------------------------------------
# Detection precedence.
#
# Query-string rules historically ran before user-agent rules. Keep that, and
# keep the whole legacy pair ahead of everything added since: a request that
# blocked before must still resolve to the same legacy rule id, because that id
# is what block-exploits.conf acts on.
# --------------------------------------------------------------------------
map $security_query_rule_id $security_legacy_rule_id {
    ""      $security_user_agent_rule_id;
    default $security_query_rule_id;
}

map $security_scanner_rule_id $security_client_rule_id {
    ""      $security_referer_rule_id;
    default $security_scanner_rule_id;
}

map $security_uri_rule_id $security_modern_rule_id {
    ""      $security_client_rule_id;
    default $security_uri_rule_id;
}

map $security_legacy_rule_id $security_detected_rule_id {
    ""      $security_modern_rule_id;
    default $security_legacy_rule_id;
}

# Detection and enforcement are separate concerns.
#
# Attribution used to be gated on $security_exploit_protection_enabled, so a
# host with Block Common Exploits switched off produced no detections at all --
# you could not see without also blocking. $security_rule_id is now simply what
# was detected, and every host gets told what matched.
map $security_detected_rule_id $security_rule_id {
    default $security_detected_rule_id;
}

# Which detected rules are permitted to block. Only the signatures inherited
# from upstream's block-exploits.conf. Everything added since is detect-only:
# these patterns match on paths that are legitimate somewhere (/actuator on a
# Spring host, /cgi-bin on genuinely old software), and a false positive here
# would take a working site down.
map $security_rule_id $security_rule_blockable {
    default      0;
    ~^sql\.      1;
    ~^file\.     1;
    ~^common\.   1;
    ~^php\.      1;
    ~^lfi\.      1;
    ~^joomla\.   1;
    ~^spam\.     1;
    ~^ua\.       1;
}

# $security_exploit_protection_enabled is set per generated proxy host. Only a
# blockable rule on a host that opted in reaches block-exploits.conf, which
# keeps enforcement byte-identical to what it was before detection was ungated.
map "$security_exploit_protection_enabled:$security_rule_blockable:$security_rule_id" $security_blocking_rule_id {
    ~^1:1:(.+)$ $1;
    default     "";
}

map $security_rule_id $security_rule_category {
    ""          "";
    ~^sql\.      sql;
    ~^file\.     file;
    ~^common\.   common;
    ~^php\.      common;
    ~^lfi\.      common;
    ~^joomla\.   common;
    ~^spam\.     spam;
    ~^ua\.       user-agent;
    ~^path\.     path-probe;
    ~^inject\.   injection;
    ~^scanner\.  scanner;
    default      "";
}

# What the match actually did to the response. A detect-only match, or a
# blockable match on a host that has not opted in, changed nothing -- recording
# it as "block" would misrepresent the request's outcome.
map "$security_rule_id:$security_exploit_protection_enabled:$security_rule_blockable" $security_rule_action {
    ~^:      "";
    ~:1:1$   block;
    default  detect;
}

# A rule match is evidence of a matched built-in rule. The other statuses are
# observations only and are intentionally not attributed to a rule.
map "$security_rule_id:$status" $security_event_type {
    ~^.+:         exploit_rule;
    ~^:401$       http_status;
    ~^:403$       http_status;
    ~^:404$       http_status;
    ~^:429$       http_status;
    ~^:5\d\d$     http_status;
    default       "";
}

# Severity describes investigation priority, not client intent or compromise.
# A blocked match is the strongest signal available here. A detect-only match is
# worth reviewing but changed nothing about the response, so it does not outrank
# an enforcement action.
map "$security_rule_action:$status" $security_severity {
    ~^block:      high;
    ~^detect:     medium;
    ~^:401$       low;
    ~^:403$       medium;
    ~^:404$       low;
    ~^:429$       medium;
    ~^:5\d\d$     medium;
    default       "";
}

map $security_event_type $security_log_enabled {
    ""      0;
    default 1;
}
