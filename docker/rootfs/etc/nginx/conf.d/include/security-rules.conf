# Stable identifiers for the built-in exploit rules.
#
# The first matching expression wins. Keep this order aligned with the former
# block-exploits.conf if chain: SQL, file, common, spam, then user-agent rules.
# These declarations make the variables available to log_format at HTTP scope;
# each generated proxy host replaces both values with its own set directives.
map $host $security_proxy_host_id {
    default "";
}

map $host $security_exploit_protection_enabled {
    default 0;
}

# Detection alone never blocks or attributes a request; $security_rule_id is
# blank unless that host enables protection.
map $query_string $security_query_rule_id {
    default "";

    ~union.*select.*\(                         sql.union-select;
    ~union.*all.*select.*                      sql.union-all-select;
    ~concat.*\(                                sql.concat;

    ~[a-zA-Z0-9_]=http://                      file.remote-url-parameter;
    ~[a-zA-Z0-9_]=(\.\.//?)+                  file.path-traversal;
    ~[a-zA-Z0-9_]=/([a-z0-9_.]//?)+            file.absolute-path;

    ~(<|%3C).*script.*(>|%3E)                  common.script-tag;
    "~GLOBALS(=|\[|\%[0-9A-Z]{0,2})"           php.globals;
    "~_REQUEST(=|\[|\%[0-9A-Z]{0,2})"          php.request;
    ~proc/self/environ                          lfi.proc-self-environ;
    "~mosConfig_[a-zA-Z_]{1,21}(=|\%3D)"        joomla.mosconfig;
    ~base64_(en|de)code\(.*\)                   php.base64-code;

    ~\b(ultram|unicauca|valium|viagra|vicodin|xanax|ypxaieo)\b
                                                spam.keyword-group-1;
    ~\b(erections|hoodia|huronriveracres|impotence|levitra|libido)\b
                                                spam.keyword-group-2;
    ~\b(ambien|blue\spill|cialis|cocaine|ejaculation|erectile)\b
                                                spam.keyword-group-3;
    ~\b(lipitor|phentermin|pro[sz]ac|sandyauer|tramadol|troyhamby)\b
                                                spam.keyword-group-4;
}

map $http_user_agent $security_user_agent_rule_id {
    default "";

    ~Indy\ Library                             ua.indy-library;
    ~libwww-perl                                ua.libwww-perl;
    ~GetRight                                   ua.getright;
    ~GetWeb!                                    ua.getweb;
    ~Go!Zilla                                   ua.gozilla;
    ~Download\ Demon                            ua.download-demon;
    ~Go-Ahead-Got-It                            ua.go-ahead-got-it;
    ~TurnitinBot                                ua.turnitinbot;
    ~GrabNet                                    ua.grabnet;
}

# Query-string rules historically ran before user-agent rules. Keep that
# precedence even when both inputs match.
map $security_query_rule_id $security_detected_rule_id {
    ""      $security_user_agent_rule_id;
    default $security_query_rule_id;
}

# $security_exploit_protection_enabled is set per generated proxy host. This
# prevents a disabled host from being attributed to a built-in rule merely
# because its request happened to resemble one.
map "$security_exploit_protection_enabled:$security_detected_rule_id" $security_rule_id {
    ~^1:(.+)$ $1;
    default    "";
}

map $security_rule_id $security_rule_category {
    ""          "";
    ~^sql\.      sql;
    ~^file\.     file;
    ~^common\.   common;
    ~^php\.      common;
    ~^lfi\.      common;
    ~^joomla\.   common;
    ~^spam\.     spam;
    ~^ua\.       user-agent;
    default      "";
}

map $security_rule_id $security_rule_action {
    ""      "";
    default block;
}

# A rule match is evidence of a matched built-in rule. The other statuses are
# observations only and are intentionally not attributed to a rule.
map "$security_rule_id:$status" $security_event_type {
    ~^.+:         exploit_rule;
    ~^:401$       http_status;
    ~^:403$       http_status;
    ~^:404$       http_status;
    ~^:429$       http_status;
    ~^:5\d\d$     http_status;
    default       "";
}

# Severity describes investigation priority, not client intent or compromise.
map "$security_rule_id:$status" $security_severity {
    ~^.+:         high;
    ~^:401$       low;
    ~^:403$       medium;
    ~^:404$       low;
    ~^:429$       medium;
    ~^:5\d\d$     medium;
    default       "";
}

map $security_event_type $security_log_enabled {
    ""      0;
    default 1;
}
