log_format proxy '[$time_local] $upstream_cache_status $upstream_status $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] [Sent-to $server] "$http_user_agent" "$http_referer"';
log_format standard '[$time_local] $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] "$http_user_agent" "$http_referer"';

# JSON Lines intended for the bounded, local Security event collector. It is a
# separate format so existing proxy access-log parsers remain unchanged.
# Do not add request bodies, cookies, Authorization values, or arbitrary headers.
log_format security_json escape=json '{'
    '"schema_version":"1",'
    '"ruleset_version":"2026-08-13",'
    '"request_id":"$request_id",'
    '"timestamp":"$time_iso8601",'
    '"msec":"$msec",'
    '"proxy_host_id":"$security_proxy_host_id",'
    '"rule_id":"$security_rule_id",'
    '"rule_category":"$security_rule_category",'
    '"rule_action":"$security_rule_action",'
    '"event_type":"$security_event_type",'
    '"severity":"$security_severity",'
    '"remote_addr":"$remote_addr",'
    '"realip_remote_addr":"$realip_remote_addr",'
    '"remote_port":"$realip_remote_port",'
    '"request_method":"$request_method",'
    '"scheme":"$scheme",'
    '"host":"$host",'
    '"request_uri":"$request_uri",'
    '"server_protocol":"$server_protocol",'
    '"status":"$status",'
    '"upstream_status":"$upstream_status",'
    '"request_length":"$request_length",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_response_time":"$upstream_response_time",'
    '"ssl_protocol":"$ssl_protocol",'
    '"ssl_cipher":"$ssl_cipher",'
    '"remote_user":"$remote_user",'
    '"http_user_agent":"$http_user_agent",'
    '"http_referer":"$http_referer"'
'}';

access_log /data/logs/fallback_http_access.log proxy;
